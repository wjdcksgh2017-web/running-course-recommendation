<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>러닝코스추천</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f4f4f2;
  color:#111;
}

header{
  padding:25px 50px;
  background:#fff;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.hero{
  display:grid;
  grid-template-columns:45% 55%;
  min-height:620px;
  background:#fff;
}

.hero-text{
  padding:80px 60px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.eyebrow{
  font-size:13px;
  font-weight:800;
  letter-spacing:2px;
  color:#777;
  margin-bottom:20px;
}

h1{
  font-size:clamp(52px,6vw,86px);
  line-height:.95;
  letter-spacing:-5px;
  margin-bottom:28px;
}

.description{
  font-size:18px;
  line-height:1.6;
  color:#555;
  max-width:500px;
  margin-bottom:30px;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  border:0;
  cursor:pointer;
  padding:15px 22px;
  border-radius:999px;
  font-size:15px;
  font-weight:700;
}

.primary{
  background:#111;
  color:#fff;
}

.secondary{
  background:#eee;
}

.hero-image{
  min-height:620px;
  background:url("https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=1800&q=90") center/cover;
}

.search-section{
  padding:70px 50px;
}

.section-title{
  font-size:34px;
  font-weight:800;
  margin-bottom:25px;
}

.filters{
  max-width:1200px;
  background:#fff;
  padding:28px;
  border-radius:22px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.filter label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#666;
  margin-bottom:8px;
}

select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  font-size:15px;
}

.search-button{
  width:100%;
  max-width:1200px;
  margin-top:16px;
  background:#111;
  color:#fff;
}

.results{
  max-width:1200px;
  margin-top:38px;
}

.result-count{
  color:#666;
  margin-bottom:18px;
}

.course-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.course-card{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.course-card:hover{
  transform:translateY(-4px);
}

.route-box{
  height:220px;
  background:#f8f8f6;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.route-label{
  position:absolute;
  top:16px;
  left:16px;
  background:#111;
  color:#fff;
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.route-svg{
  width:80%;
  height:80%;
}

.route-line{
  fill:none;
  stroke:#111;
  stroke-width:7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.route-start{
  fill:#111;
}

.route-end{
  fill:#fff;
  stroke:#111;
  stroke-width:5;
}

.course-info{
  padding:22px;
}

.course-info h3{
  font-size:21px;
  margin-bottom:7px;
}

.nickname{
  color:#777;
  font-size:14px;
  margin-bottom:12px;
}

.course-meta{
  color:#666;
  font-size:14px;
  margin-bottom:12px;
}

.score{
  font-weight:800;
  margin-bottom:12px;
}

.tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.tag{
  background:#f0f0ee;
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
}

.no-result{
  background:#fff;
  padding:40px;
  border-radius:20px;
  text-align:center;
}

.detail-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.detail-modal.open{
  display:flex;
}

.detail-panel{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:24px;
  padding:28px;
}

.detail-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

.detail-top h2{
  font-size:30px;
}

.close-detail{
  background:#eee;
  padding:10px 15px;
}

.detail-route{
  height:280px;
  background:#f8f8f6;
  border-radius:18px;
  margin-bottom:22px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.detail-description{
  color:#555;
  line-height:1.7;
  margin-bottom:20px;
}

.detail-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.detail-item{
  background:#f5f5f3;
  padding:14px;
  border-radius:14px;
}

.detail-item strong{
  display:block;
  font-size:12px;
  color:#777;
  margin-bottom:5px;
}

.map-button{
  display:block;
  text-align:center;
  background:#111;
  color:#fff;
  padding:15px;
  border-radius:999px;
  text-decoration:none;
  font-weight:700;
}

footer{
  background:#111;
  color:#777;
  padding:38px 50px;
}

@media(max-width:800px){

  header{
    padding:22px;
  }

  .hero{
    grid-template-columns:1fr;
  }

  .hero-text{
    padding:70px 24px;
  }

  .hero-image{
    min-height:400px;
  }

  .search-section{
    padding:55px 24px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .course-grid{
    grid-template-columns:1fr;
  }

  .detail-list{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>
  <div class="logo">러닝코스추천</div>
</header>


<section class="hero">

  <div class="hero-text">

    <div class="eyebrow">
      RUN YOUR WAY
    </div>

    <h1>
      오늘<br>
      어디서<br>
      달릴까요?
    </h1>

    <p class="description">
      단순히 거리를 찾는 것이 아니라
      재미있는 루트 모양의 러닝코스를 찾아보세요.
    </p>

    <div class="buttons">

      <button
        type="button"
        id="goSearch"
        class="primary">
        코스 검색하기
      </button>

      <button
        type="button"
        id="nearbyTop"
        class="secondary">
        내 주변 코스
      </button>

    </div>

  </div>

  <div class="hero-image"></div>

</section>


<section
  class="search-section"
  id="search">

  <div class="section-title">
    나에게 맞는 코스 찾기
  </div>


  <div class="filters">

    <div class="filter">

      <label>
        지역
      </label>

      <select id="region">

        <option value="all">
          전체 지역
        </option>

        <option value="서울">
          서울
        </option>

        <option value="파주">
          파주
        </option>

      </select>

    </div>


    <div class="filter">

      <label>
        거리
      </label>

      <select id="distance">

        <option value="all">
          전체 거리
        </option>

        <option value="3">
          3km
        </option>

        <option value="5">
          5km
        </option>

        <option value="10">
          10km
        </option>

      </select>

    </div>


    <div class="filter">

      <label>
        난이도
      </label>

      <select id="level">

        <option value="all">
          전체 난이도
        </option>

        <option value="초보">
          초보
        </option>

        <option value="중급">
          중급
        </option>

        <option value="상급">
          상급
        </option>

      </select>

    </div>


    <div class="filter">

      <label>
        취향
      </label>

      <select id="style">

        <option value="all">
          전체 취향
        </option>

        <option value="평지">
          평지
        </option>

        <option value="야경">
          야경
        </option>

        <option value="강변">
          강변
        </option>

        <option value="공원">
          공원
        </option>

        <option value="트레일">
          트레일
        </option>

        <option value="풍경">
          풍경
        </option>

      </select>

    </div>

  </div>


  <button
    type="button"
    id="searchButton"
    class="search-button">

    러닝코스 찾기

  </button>


  <div class="results">

    <div
      id="resultCount"
      class="result-count">
    </div>

    <div
      id="courseGrid"
      class="course-grid">
    </div>

  </div>

</section>


<div
  class="detail-modal"
  id="detailModal">

  <div class="detail-panel">

    <div class="detail-top">

      <h2 id="detailName"></h2>

      <button
        type="button"
        id="closeDetail"
        class="close-detail">
        닫기
      </button>

    </div>


    <div
      class="detail-route"
      id="detailRoute">
    </div>


    <div
      id="detailNickname"
      class="nickname">
    </div>


    <div
      id="detailScore"
      class="score">
    </div>


    <p
      id="detailDescription"
      class="detail-description">
    </p>


    <div class="detail-list">

      <div class="detail-item">
        <strong>지역</strong>
        <span id="detailRegion"></span>
      </div>

      <div class="detail-item">
        <strong>거리</strong>
        <span id="detailDistance"></span>
      </div>

      <div class="detail-item">
        <strong>난이도</strong>
        <span id="detailLevel"></span>
      </div>

      <div class="detail-item">
        <strong>추천 시간</strong>
        <span id="detailTime"></span>
      </div>

    </div>


    <a
      id="mapButton"
      class="map-button"
      target="_blank"
      rel="noopener noreferrer">

      네이버 지도에서 보기

    </a>

  </div>

</div>


<footer>
  러닝코스추천 · 서울과 파주부터 시작합니다.
</footer>


<script>

const courses = [

  {
    name:"반포한강공원",
    nickname:"🍠 고구마런",
    region:"서울",
    distance:5.5,
    level:"초보",
    styles:["평지","야경","강변"],
    score:98,
    description:"한강을 따라 달리다가 반환하는 왕복형 코스입니다.",
    time:"아침 · 저녁",
    map:"반포한강공원",
    shape:"sweet"
  },

  {
    name:"여의도공원",
    nickname:"🥚 에그런",
    region:"서울",
    distance:5,
    level:"초보",
    styles:["평지","공원"],
    score:96,
    description:"공원과 한강을 함께 즐길 수 있는 타원형 느낌의 코스입니다.",
    time:"아침 · 저녁",
    map:"여의도공원",
    shape:"egg"
  },

  {
    name:"잠실한강공원",
    nickname:"🐟 물고기런",
    region:"서울",
    distance:7,
    level:"초보",
    styles:["평지","야경","강변"],
    score:95,
    description:"한강변을 따라 순환하는 루프형 코스입니다.",
    time:"아침 · 저녁",
    map:"잠실한강공원",
    shape:"fish"
  },

  {
    name:"서울숲",
    nickname:"🍃 나뭇잎런",
    region:"서울",
    distance:4.5,
    level:"초보",
    styles:["평지","공원"],
    score:92,
    description:"서울숲 주변을 가볍게 순환하는 공원형 코스입니다.",
    time:"아침 · 저녁",
    map:"서울숲",
    shape:"leaf"
  },

  {
    name:"운정호수공원",
    nickname:"🍩 도넛런",
    region:"파주",
    distance:4,
    level:"초보",
    styles:["평지","공원","야경"],
    score:97,
    description:"호수 주변을 크게 한 바퀴 도는 순환형 코스입니다.",
    time:"아침 · 저녁",
    map:"운정호수공원",
    shape:"donut"
  },

  {
    name:"임진각 평화누리",
    nickname:"🪁 연날리기런",
    region:"파주",
    distance:5,
    level:"초보",
    styles:["평지","공원","풍경"],
    score:94,
    description:"넓은 공원과 주변 풍경을 즐길 수 있는 코스입니다.",
    time:"낮 · 해질녘",
    map:"임진각 평화누리공원",
    shape:"kite"
  },

  {
    name:"공릉천",
    nickname:"🐍 뱀런",
    region:"파주",
    distance:10,
    level:"중급",
    styles:["평지","강변"],
    score:92,
    description:"하천을 따라 길게 달리는 직선형 러닝코스입니다.",
    time:"아침 · 저녁",
    map:"공릉천",
    shape:"snake"
  }

];


function routeSVG(shape){

  if(shape==="sweet"){
    return `
      <svg class="route-svg" viewBox="0 0 300 200">
        <path class="route-line"
          d="M40 160 C80 130 70 60 130 55 C200 50 230 100 180 135 C140 165 100 175 40 160"/>
        <circle class="route-start" cx="40" cy="160" r="8"/>
        <circle class="route-end" cx="40" cy="160" r="14"/>
      </svg>
    `;
  }


  if(shape==="egg"){
    return `
      <svg class="route-svg" viewBox="0 0 300 200">
        <ellipse class="route-line"
          cx="150"
          cy="100"
          rx="85"
          ry="65"/>
        <circle class="route-start" cx="65" cy="100" r="8"/>
        <circle class="route-end" cx="65" cy="100" r="14"/>
      </svg>
    `;
  }


  if(shape==="fish"){
    return `
      <svg class="route-svg" viewBox="0 0 300 200">
        <path class="route-line"
          d="M45 100 C80 45 180 45 220 100 C180 155 80 155 45 100 L20 65 M45 100 L20 135"/>
        <circle class="route-start" cx="45" cy="100" r="8"/>
        <circle class="route-end" cx="45" cy="100" r="14"/>
      </svg>
    `;
  }


  if(shape==="leaf"){
    return `
      <svg class="route-svg" viewBox="0 0 300 200">
        <path class="route-line"
          d="M60 140 C80 50 210 35 235 80 C215 145 120 170 60 140"/>
        <path class="route-line"
          d="M65 138 L190 70"/>
        <circle class="route-start" cx="60" cy="140" r="8"/>
      </svg>
    `;
  }


  if(shape==="donut"){
    return `
      <svg class="route-svg" viewBox="0 0 300 200">
        <ellipse class="route-line"
          cx="150"
          cy="100"
          rx="90"
          ry="65"/>
        <ellipse class="route-line"
          cx="150"
          cy="100"
          rx="35"
          ry="22"/>
        <circle class="route-start" cx="60" cy="100" r="8"/>
      </svg>
    `;
  }


  if(shape==="kite"){
    return `
      <svg class="route-svg" viewBox="0 0 300 200">
        <path class="route-line"
          d="M150 25 L235 95 L150 170 L65 95 Z"/>
        <path class="route-line"
          d="M150 170 L150 190"/>
        <circle class="route-start" cx="150" cy="25" r="8"/>
      </svg>
    `;
  }


  if(shape==="snake"){
    return `
      <svg class="route-svg" viewBox="0 0 300 200">
        <path class="route-line"
          d="M30 150 C80 30 130 170 180 55 C205 0 245 35 270 70"/>
        <circle class="route-start" cx="30" cy="150" r="8"/>
        <circle class="route-end" cx="270" cy="70" r="14"/>
      </svg>
    `;
  }

}


function searchCourses(){

  const region =
    document.getElementById("region").value;

  const distance =
    document.getElementById("distance").value;

  const level =
    document.getElementById("level").value;

  const style =
    document.getElementById("style").value;


  const result =
    courses
      .filter(function(course){

        const regionOK =
          region==="all" ||
          course.region===region;

        const levelOK =
          level==="all" ||
          course.level===level;

        const styleOK =
          style==="all" ||
          course.styles.includes(style);

        const distanceOK =
          distance==="all" ||
          Math.abs(
            course.distance-
            Number(distance)
          )<=2;

        return(
          regionOK &&
          levelOK &&
          styleOK &&
          distanceOK
        );

      })
      .sort(function(a,b){

        return b.score-a.score;

      });


  document
    .getElementById("resultCount")
    .innerText =
      "조건에 맞는 러닝코스 "+
      result.length+
      "개";


  const grid =
    document.getElementById("courseGrid");


  if(result.length===0){

    grid.innerHTML=`
      <div class="no-result">
        <h3>
          조건에 맞는 코스를 찾지 못했어요.
        </h3>
        <p style="margin-top:10px;">
          검색 조건을 조금 넓혀보세요.
        </p>
      </div>
    `;

    return;
  }


  grid.innerHTML =
    result.map(function(course){

      return `

        <div
          class="course-card"
          data-index="${courses.indexOf(course)}">

          <div class="route-box">

            <div class="route-label">
              ${course.nickname}
            </div>

            ${routeSVG(course.shape)}

          </div>


          <div class="course-info">

            <h3>
              ${course.name}
            </h3>

            <div class="nickname">
              ${course.nickname}
            </div>

            <div class="course-meta">
              ${course.region}
              · ${course.distance}km
              · ${course.level}
            </div>

            <div class="score">
              추천도 ${course.score}점
            </div>

            <div class="tags">

              ${
                course.styles.map(function(tag){

                  return `
                    <span class="tag">
                      ${tag}
                    </span>
                  `;

                }).join("")
              }

            </div>

          </div>

        </div>

      `;

    }).join("");

}


function openDetail(course){

  document
    .getElementById("detailName")
    .innerText=course.name;


  document
    .getElementById("detailNickname")
    .innerText=course.nickname;


  document
    .getElementById("detailScore")
    .innerText=
      "추천도 "+
      course.score+
      "점";


  document
    .getElementById("detailDescription")
    .innerText=
      course.description;


  document
    .getElementById("detailRegion")
    .innerText=
      course.region;


  document
    .getElementById("detailDistance")
    .innerText=
      course.distance+"km";


  document
    .getElementById("detailLevel")
    .innerText=
      course.level;


  document
    .getElementById("detailTime")
    .innerText=
      course.time;


  document
    .getElementById("detailRoute")
    .innerHTML=
      routeSVG(course.shape);


  document
    .getElementById("mapButton")
    .href=
      "https://map.naver.com/p/search/"+
      encodeURIComponent(course.map);


  document
    .getElementById("detailModal")
    .classList.add("open");

}


document
  .getElementById("searchButton")
  .onclick=
    searchCourses;


document
  .getElementById("goSearch")
  .onclick=
    function(){

      document
        .getElementById("search")
        .scrollIntoView({
          behavior:"smooth"
        });

    };


document
  .getElementById("nearbyTop")
  .onclick=
    function(){

      if(!navigator.geolocation){

        alert(
          "이 브라우저에서는 위치 기능을 사용할 수 없습니다."
        );

        return;
      }


      navigator.geolocation.getCurrentPosition(

        function(){

          alert(
            "현재 위치를 확인했습니다.\n\n"+
            "다음 단계에서 가까운 러닝코스를 연결할게요."
          );

        },

        function(){

          alert(
            "위치 권한을 허용해주세요."
          );

        }

      );

    };


document
  .getElementById("courseGrid")
  .addEventListener(
    "click",
    function(event){

      const card =
        event.target.closest(
          ".course-card"
        );

      if(!card){
        return;
      }

      const course=
        courses[
          Number(card.dataset.index)
        ];

      openDetail(course);

    }
  );


document
  .getElementById("closeDetail")
  .onclick=
    function(){

      document
        .getElementById("detailModal")
        .classList.remove("open");

    };


document
  .getElementById("detailModal")
  .onclick=
    function(event){

      if(
        event.target.id===
        "detailModal"
      ){

        document
          .getElementById("detailModal")
          .classList.remove("open");

      }

    };


searchCourses();

</script>

</body>
</html>
