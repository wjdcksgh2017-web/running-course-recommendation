<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>러닝코스추천</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f4f4f2;
  color:#111;
}

header{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:28px 50px;
  z-index:5;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.hero{
  min-height:700px;
  display:grid;
  grid-template-columns:45% 55%;
  background:#fff;
}

.hero-text{
  padding:130px 60px 70px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.eyebrow{
  font-size:13px;
  font-weight:800;
  letter-spacing:2px;
  color:#777;
  margin-bottom:22px;
}

h1{
  font-size:clamp(52px,6vw,86px);
  line-height:.95;
  letter-spacing:-5px;
  margin-bottom:28px;
}

.description{
  font-size:18px;
  line-height:1.6;
  color:#555;
  max-width:500px;
  margin-bottom:32px;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:0;
  cursor:pointer;
  padding:15px 22px;
  border-radius:999px;
  font-size:15px;
  font-weight:700;
}

.primary{
  background:#111;
  color:#fff;
}

.secondary{
  background:#eee;
  color:#111;
}

.hero-image{
  min-height:700px;
  background:url("https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=1800&q=90") center/cover;
}

.search-section{
  padding:75px 50px;
  background:#f4f4f2;
}

.section-title{
  font-size:34px;
  font-weight:800;
  letter-spacing:-2px;
  margin-bottom:28px;
}

.filters{
  max-width:1200px;
  background:#fff;
  padding:28px;
  border-radius:22px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.filter label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#666;
  margin-bottom:8px;
}

select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  font-size:15px;
}

.search-button{
  display:block;
  width:100%;
  max-width:1200px;
  margin-top:16px;
  background:#111;
  color:#fff;
}

.results{
  max-width:1200px;
  margin-top:38px;
}

.result-count{
  color:#666;
  margin-bottom:18px;
}

.course-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.course-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.course-image{
  height:205px;
  background-size:cover;
  background-position:center;
}

.course-info{
  padding:22px;
}

.course-info h3{
  font-size:20px;
  margin-bottom:9px;
}

.course-meta{
  font-size:14px;
  color:#666;
  margin-bottom:12px;
}

.score{
  font-weight:800;
  margin-bottom:12px;
}

.tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.tag{
  background:#f0f0ee;
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
}

.no-result{
  background:#fff;
  border-radius:18px;
  padding:40px;
  text-align:center;
  color:#777;
}

footer{
  background:#111;
  color:#777;
  padding:38px 50px;
}

@media(max-width:800px){

  header{
    padding:22px;
  }

  .hero{
    grid-template-columns:1fr;
  }

  .hero-text{
    padding:115px 24px 55px;
  }

  .hero-image{
    min-height:430px;
  }

  .search-section{
    padding:58px 24px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .course-grid{
    grid-template-columns:1fr;
  }

  h1{
    letter-spacing:-3px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">러닝코스추천</div>
</header>

<section class="hero">

  <div class="hero-text">

    <div class="eyebrow">
      RUN YOUR WAY
    </div>

    <h1>
      오늘<br>
      어디서<br>
      달릴까요?
    </h1>

    <p class="description">
      지역과 거리, 취향에 맞는 러닝코스를 찾아보세요.
      당신에게 가장 잘 맞는 코스를 추천해드립니다.
    </p>

    <div class="buttons">
      <button type="button" id="goSearch" class="primary">
        코스 검색하기
      </button>

      <button type="button" id="nearbyTop" class="secondary">
        내 주변 코스
      </button>
    </div>

  </div>

  <div class="hero-image"></div>

</section>


<section class="search-section" id="search">

  <div class="section-title">
    나에게 맞는 코스 찾기
  </div>

  <div class="filters">

    <div class="filter">

      <label for="region">
        지역
      </label>

      <select id="region">
        <option value="all">전체 지역</option>
        <option value="서울">서울</option>
        <option value="경기">경기</option>
        <option value="인천">인천</option>
      </select>

    </div>


    <div class="filter">

      <label for="distance">
        거리
      </label>

      <select id="distance">
        <option value="all">전체 거리</option>
        <option value="3">3km</option>
        <option value="5">5km</option>
        <option value="10">10km</option>
      </select>

    </div>


    <div class="filter">

      <label for="level">
        난이도
      </label>

      <select id="level">
        <option value="all">전체 난이도</option>
        <option value="초보">초보</option>
        <option value="중급">중급</option>
        <option value="상급">상급</option>
      </select>

    </div>


    <div class="filter">

      <label for="style">
        취향
      </label>

      <select id="style">
        <option value="all">전체 취향</option>
        <option value="평지">평지</option>
        <option value="야경">야경</option>
        <option value="강변">강변</option>
        <option value="공원">공원</option>
      </select>

    </div>

  </div>


  <button
    type="button"
    id="searchButton"
    class="search-button">

    러닝코스 찾기

  </button>


  <div class="results">

    <div
      id="resultCount"
      class="result-count">
    </div>

    <div
      id="courseGrid"
      class="course-grid">
    </div>

  </div>

</section>


<footer>
  러닝코스추천 · 당신에게 맞는 러닝코스를 찾아보세요.
</footer>

<script>

const courses = [
  {
    name: "한강 반포 러닝코스",
    region: "서울",
    distance: 5.2,
    level: "초보",
    styles: ["평지", "야경", "강변"],
    score: 96
  },
  {
    name: "잠실 한강 러닝코스",
    region: "서울",
    distance: 5,
    level: "초보",
    styles: ["평지", "강변", "야경"],
    score: 94
  },
  {
    name: "여의도 한강공원",
    region: "서울",
    distance: 5.8,
    level: "초보",
    styles: ["평지", "야경", "공원"],
    score: 93
  },
  {
    name: "탄천 러닝코스",
    region: "경기",
    distance: 10,
    level: "중급",
    styles: ["평지", "강변"],
    score: 91
  },
  {
    name: "일산 호수공원",
    region: "경기",
    distance: 5,
    level: "초보",
    styles: ["공원", "평지"],
    score: 90
  },
  {
    name: "송도 센트럴파크",
    region: "인천",
    distance: 3,
    level: "초보",
    styles: ["공원", "야경", "평지"],
    score: 92
  }
];


function searchCourses() {

  const region = document.getElementById("region").value;
  const distance = document.getElementById("distance").value;
  const level = document.getElementById("level").value;
  const style = document.getElementById("style").value;

  const result = courses.filter(function(course) {

    const regionOK =
      region === "all" || course.region === region;

    const levelOK =
      level === "all" || course.level === level;

    const styleOK =
      style === "all" ||
      course.styles.includes(style);

    const distanceOK =
      distance === "all" ||
      Math.abs(course.distance - Number(distance)) <= 1.5;

    return regionOK &&
           levelOK &&
           styleOK &&
           distanceOK;

  });

  result.sort(function(a, b) {
    return b.score - a.score;
  });


  const grid =
    document.getElementById("courseGrid");

  const count =
    document.getElementById("resultCount");


  count.innerText =
    "조건에 맞는 러닝코스 " +
    result.length +
    "개";


  if (result.length === 0) {

    grid.innerHTML = `
      <div class="no-result">
        <h3>조건에 맞는 코스를 찾지 못했어요.</h3>
        <p style="margin-top:10px;">
          검색 조건을 조금 넓혀보세요.
        </p>
      </div>
    `;

    return;
  }


  grid.innerHTML = result.map(function(course) {

    return `
      <div class="course-card">

        <div
          class="course-image"
          style="
            background-image:
            url('https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=1000&q=85');
          ">
        </div>

        <div class="course-info">

          <h3>${course.name}</h3>

          <div class="course-meta">
            ${course.region}
            · ${course.distance}km
            · ${course.level}
          </div>

          <div class="score">
            추천도 ${course.score}점
          </div>

          <div class="tags">

            ${course.styles.map(function(tag) {
              return `
                <span class="tag">
                  ${tag}
                </span>
              `;
            }).join("")}

          </div>

        </div>

      </div>
    `;

  }).join("");

}


document
  .getElementById("searchButton")
  .onclick = searchCourses;


document
  .getElementById("goSearch")
  .onclick = function() {

    document
      .getElementById("search")
      .scrollIntoView({
        behavior: "smooth"
      });

  };


searchCourses();

</script>


</body>
</html>
