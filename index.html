<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>러닝코스추천</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f4f4f2;
  color:#111;
}

header{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:28px 50px;
  z-index:5;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.hero{
  min-height:700px;
  display:grid;
  grid-template-columns:45% 55%;
  background:#fff;
}

.hero-text{
  padding:130px 60px 70px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.eyebrow{
  font-size:13px;
  font-weight:800;
  letter-spacing:2px;
  color:#777;
  margin-bottom:22px;
}

h1{
  font-size:clamp(52px,6vw,86px);
  line-height:.95;
  letter-spacing:-5px;
  margin-bottom:28px;
}

.description{
  font-size:18px;
  line-height:1.6;
  color:#555;
  max-width:500px;
  margin-bottom:32px;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:0;
  cursor:pointer;
  padding:15px 22px;
  border-radius:999px;
  font-size:15px;
  font-weight:700;
}

.primary{
  background:#111;
  color:#fff;
}

.secondary{
  background:#eee;
  color:#111;
}

.hero-image{
  min-height:700px;
  background:url("https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=1800&q=90") center/cover;
}

.search-section{
  padding:75px 50px;
  background:#f4f4f2;
}

.section-title{
  font-size:34px;
  font-weight:800;
  letter-spacing:-2px;
  margin-bottom:28px;
}

.filters{
  max-width:1200px;
  background:#fff;
  padding:28px;
  border-radius:22px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.filter label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#666;
  margin-bottom:8px;
}

select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  font-size:15px;
}

.search-button{
  display:block;
  width:100%;
  max-width:1200px;
  margin-top:16px;
  background:#111;
  color:#fff;
}

.results{
  max-width:1200px;
  margin-top:38px;
}

.result-count{
  color:#666;
  margin-bottom:18px;
}

.course-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.course-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
  cursor:pointer;
  transition:.2s;
}

.course-card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 25px rgba(0,0,0,.1);
}

.course-image{
  height:205px;
  background-size:cover;
  background-position:center;
}

.course-info{
  padding:22px;
}

.course-info h3{
  font-size:20px;
  margin-bottom:9px;
}

.course-meta{
  font-size:14px;
  color:#666;
  margin-bottom:12px;
}

.score{
  font-weight:800;
  margin-bottom:12px;
}

.tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.tag{
  background:#f0f0ee;
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
}

.no-result{
  background:#fff;
  border-radius:18px;
  padding:40px;
  text-align:center;
  color:#777;
}

footer{
  background:#111;
  color:#777;
  padding:38px 50px;
}


/* 상세정보 팝업 */

.detail-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.detail-modal.open{
  display:flex;
}

.detail-panel{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:24px;
  padding:28px;
}

.detail-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:20px;
}

.detail-top h2{
  font-size:30px;
  line-height:1.2;
}

.close-detail{
  background:#eee;
  padding:10px 15px;
}

.detail-score{
  font-weight:800;
  margin-bottom:16px;
}

.detail-description{
  color:#555;
  line-height:1.7;
  margin-bottom:22px;
}

.detail-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:22px;
}

.detail-item{
  background:#f5f5f3;
  border-radius:14px;
  padding:14px;
}

.detail-item strong{
  display:block;
  font-size:12px;
  color:#777;
  margin-bottom:5px;
}

.detail-actions{
  display:flex;
}

.map-button{
  width:100%;
  text-align:center;
  text-decoration:none;
  background:#111;
  color:#fff;
  padding:15px 20px;
  border-radius:999px;
  font-weight:700;
}


@media(max-width:800px){

  header{
    padding:22px;
  }

  .hero{
    grid-template-columns:1fr;
  }

  .hero-text{
    padding:115px 24px 55px;
  }

  .hero-image{
    min-height:430px;
  }

  .search-section{
    padding:58px 24px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .course-grid{
    grid-template-columns:1fr;
  }

  h1{
    letter-spacing:-3px;
  }

  .detail-list{
    grid-template-columns:1fr;
  }

}

</style>
</head>

    document.getElementById("distance").value;

  const level =
    document.getElementById("level").value;

  const style =
    document.getElementById("style").value;


  const result =
    courses.filter(function(course){

      const regionOK =
        region === "all" ||
        course.region === region;


      const levelOK =
        level === "all" ||
        course.level === level;


      const styleOK =
        style === "all" ||
        course.styles.includes(style);


      const distanceOK =
        distance === "all" ||
        course.distance === null ||
        Math.abs(
          course.distance -
          Number(distance)
        ) <= 1.5;


      return (
        regionOK &&
        levelOK &&
        styleOK &&
        distanceOK
      );

    })
    .sort(function(a,b){

      return b.score-a.score;

    });



  document
    .getElementById("resultCount")
    .innerText =
      "조건에 맞는 러닝코스 " +
      result.length +
      "개";



  const grid =
    document.getElementById("courseGrid");


  if(result.length === 0){

    grid.innerHTML = `
      <div class="no-result">

        <h3>
          조건에 맞는 코스를 찾지 못했어요.
        </h3>

        <p style="margin-top:10px;">
          검색 조건을 조금 넓혀보세요.
        </p>

      </div>
    `;

    return;

  }



  grid.innerHTML =
    result.map(function(course){

      return `

        <div
          class="course-card"
          data-index="${courses.indexOf(course)}">

          <div
            class="course-image"
            style="
              background-image:url('${course.image}')
            ">
          </div>


          <div class="course-info">

            <h3>
              ${course.name}
            </h3>

            <div class="course-meta">

              ${course.region}
              ·
              ${
                course.distance === null
                ? "대표거리 확인중"
                : course.distance + "km"
              }
              ·
              ${course.level}

            </div>


            <div class="score">

              추천도
              ${course.score}점

            </div>


            <div class="tags">

              ${
                course.styles
                  .map(function(tag){

                    return `
                      <span class="tag">
                        ${tag}
                      </span>
                    `;

                  })
                  .join("")
              }

            </div>

          </div>

        </div>

      `;

    })
    .join("");

}



function openDetail(course){

  document
    .getElementById("detailName")
    .innerText =
      course.name;


  document
    .getElementById("detailScore")
    .innerText =
      "추천도 " +
      course.score +
      "점";


  document
    .getElementById("detailDescription")
    .innerText =
      course.description;


  document
    .getElementById("detailRegion")
    .innerText =
      course.region;


  document
    .getElementById("detailDistance")
    .innerText =
      course.distance === null
      ? "대표거리 확인중"
      : course.distance + "km";


  document
    .getElementById("detailLevel")
    .innerText =
      course.level;


  document
    .getElementById("detailTime")
    .innerText =
      course.time;


  document
    .getElementById("detailFacilities")
    .innerText =
      course.facilities;


  document
    .getElementById("detailStyles")
    .innerText =
      course.styles.join(" · ");


  document
    .getElementById("mapButton")
    .href =
      "https://map.naver.com/p/search/" +
      encodeURIComponent(course.map);


  document
    .getElementById("detailModal")
    .classList.add("open");


  document
    .getElementById("detailModal")
    .setAttribute(
      "aria-hidden",
      "false"
    );

}



function closeDetail(){

  document
    .getElementById("detailModal")
    .classList.remove("open");


  document
    .getElementById("detailModal")
    .setAttribute(
      "aria-hidden",
      "true"
    );

}



document
  .getElementById("searchButton")
  .onclick =
    searchCourses;



document
  .getElementById("goSearch")
  .onclick =
    function(){

      document
        .getElementById("search")
        .scrollIntoView({
          behavior:"smooth"
        });

    };



document
  .getElementById("nearbyTop")
  .onclick =
    function(){

      if(!navigator.geolocation){

        alert(
          "이 브라우저에서는 위치 기능을 사용할 수 없습니다."
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(){

          alert(
            "현재 위치를 확인했습니다.\n\n" +
            "다음 단계에서 가까운 러닝코스를 연결할게요."
          );

        },

        function(){

          alert(
            "위치 권한을 허용해주세요."
          );

        }

      );

    };



document
  .getElementById("courseGrid")
  .addEventListener(
    "click",
    function(event){

      const card =
        event.target.closest(
          ".course-card"
        );


      if(!card){
        return;
      }


      const course =
        courses[
          Number(card.dataset.index)
        ];


      if(course){
        openDetail(course);
      }

    }
  );



document
  .getElementById("closeDetail")
  .onclick =
    closeDetail;



document
  .getElementById("detailModal")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target.id ===
        "detailModal"
      ){

        closeDetail();

      }

    }
  );



document
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key ===
        "Escape"
      ){

        closeDetail();

      }

    }
  );



searchCourses();

</script>


</body>
</html>
